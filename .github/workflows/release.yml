name: Release

# Workflow de release principal — build le binaire unifié `meshcore` (TUI + CLI)
# pour 5 cibles : Linux x86_64, Linux ARM64, Windows x64, macOS Intel, macOS ARM.
#
# Léger (~5 min/build) car sans Tauri/WebKit. Pour ressortir une GUI legacy, utiliser
# manuellement le workflow `release-gui.yml`.

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-native:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary_suffix: ""
            asset_name: meshcore_linux_x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary_suffix: ".exe"
            asset_name: meshcore_windows_x64.exe
          - target: x86_64-apple-darwin
            os: macos-latest
            binary_suffix: ""
            asset_name: meshcore_macos_x64
          - target: aarch64-apple-darwin
            os: macos-latest
            binary_suffix: ""
            asset_name: meshcore_macos_arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build meshcore
        run: cargo build --release --target ${{ matrix.target }} --package meshcore-cli

      - name: Rename binary
        shell: bash
        run: |
          SRC="target/${{ matrix.target }}/release/meshcore${{ matrix.binary_suffix }}"
          DEST="${{ matrix.asset_name }}"
          cp "${SRC}" "${DEST}"

      - name: Package .deb (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p deb/DEBIAN deb/usr/bin
          cp target/${{ matrix.target }}/release/meshcore deb/usr/bin/
          chmod +x deb/usr/bin/meshcore
          cat > deb/DEBIAN/control <<CTRL
          Package: meshcore
          Version: ${VERSION}
          Section: comm
          Priority: optional
          Architecture: amd64
          Depends: libc6, libdbus-1-3
          Maintainer: Michel Dessenne
          Description: MeshCore — TUI + CLI unifié pour réseaux LoRa MeshCore
           Terminal application (TUI ratatui) and command-line interface
           combined in a single binary. Supports BLE, Serial and TCP
           connections to MeshCore devices.
          CTRL
          dpkg-deb --build deb meshcore_${VERSION}_amd64.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            meshcore_*_amd64.deb

  build-linux-arm64:
    name: Build aarch64-unknown-linux-gnu (cross Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ubuntu-cross-arm64-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build meshcore ARM64 via cross
        run: cross build --release --target aarch64-unknown-linux-gnu --package meshcore-cli

      - name: Rename binary
        run: cp target/aarch64-unknown-linux-gnu/release/meshcore meshcore_linux_arm64

      - name: Package .deb (Linux ARM64)
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p deb/DEBIAN deb/usr/bin
          cp target/aarch64-unknown-linux-gnu/release/meshcore deb/usr/bin/
          chmod +x deb/usr/bin/meshcore
          cat > deb/DEBIAN/control <<CTRL
          Package: meshcore
          Version: ${VERSION}
          Section: comm
          Priority: optional
          Architecture: arm64
          Depends: libc6, libdbus-1-3
          Maintainer: Michel Dessenne
          Description: MeshCore — TUI + CLI unifié pour réseaux LoRa MeshCore (ARM64)
           Terminal application (TUI ratatui) and command-line interface
           combined in a single binary. Supports BLE, Serial and TCP
           connections. Built for Raspberry Pi 4/5 and other ARM64 Linux.
          CTRL
          dpkg-deb --build deb meshcore_${VERSION}_arm64.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshcore_linux_arm64
          path: |
            meshcore_linux_arm64
            meshcore_*_arm64.deb

  release:
    name: Create GitHub Release
    needs: [build-native, build-linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/meshcore_linux_x86_64
            artifacts/**/meshcore_linux_arm64
            artifacts/**/meshcore_windows_x64.exe
            artifacts/**/meshcore_macos_x64
            artifacts/**/meshcore_macos_arm64
            artifacts/**/meshcore_*_amd64.deb
            artifacts/**/meshcore_*_arm64.deb
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## MeshCore — binaire unifié TUI + CLI

            Un seul exécutable `meshcore` par plateforme.

            ### Modes d'utilisation

            - `meshcore`                    lance la TUI ratatui (mode interactif par défaut)
            - `meshcore <sous-commande>`    exécute en one-shot (scripting)
            - `meshcore --repl`             ancien REPL rustyline (legacy)

            ### Assets

            | Plateforme | Binaire | Package |
            |-----------|---------|---------|
            | Linux x86_64 | `meshcore_linux_x86_64` | `meshcore_*_amd64.deb` |
            | Linux ARM64 (RPi 4/5) | `meshcore_linux_arm64` | `meshcore_*_arm64.deb` |
            | Windows x64 | `meshcore_windows_x64.exe` | — |
            | macOS Intel | `meshcore_macos_x64` | — |
            | macOS ARM | `meshcore_macos_arm64` | — |

            ### Notes

            - **Windows** : Windows Terminal fortement recommandé pour les emojis et le rendu ANSI
            - **macOS** : autoriser l'accès Bluetooth dans *Réglages → Confidentialité* à la première connexion
            - **Linux** : BlueZ requis pour le BLE (installé par défaut dans la plupart des distributions)
