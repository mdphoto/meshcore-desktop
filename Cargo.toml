[workspace]
resolver = "2"
members = [
    "crates/meshcore-protocol",
    "crates/meshcore-crypto",
    "crates/meshcore-transport",
    "crates/meshcore-storage",
    "crates/meshcore-service",
    "crates/meshcore-app",
    "crates/meshcore-cli",
    "crates/meshcore-tui",
]

[workspace.package]
version = "0.3.2"
edition = "2024"
license = "MIT"
authors = ["Michel Dessenne"]

# Profile release optimisé pour distribution : binaires plus petits et plus rapides.
# Coût : compilation ~1 min au lieu de 13 s. Seul le mode `--release` est affecté.
[profile.release]
strip = true          # retire les symboles de debug (~12 Mo → ~9 Mo)
lto = "thin"          # link-time optimization (gain taille + perf)
codegen-units = 1     # meilleures optims inter-modules
opt-level = 3
panic = "abort"       # plus de petit + pas de stack unwinding inutile

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# MeshCore protocol — pinné à 0.1.9, la 0.1.10+ introduit une API cassante sur
# request_neighbours_with_timeout (4 → 6 args) qui doit être portée avant upgrade
meshcore-rs = "=0.1.9"

# Crypto
aes = "0.8"
cipher = "0.4"
hmac = "0.12"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

# Storage
rusqlite = { version = "0.34", features = ["bundled"] }

# Binary encoding
byteorder = "1"
bytes = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Tauri
tauri = { version = "2", features = [] }
tauri-build = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"

# BLE
btleplug = "0.11"

# Serial
tokio-serial = "5"

# Compression
smaz = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }
rustyline = "15"
colored = "3"
dirs = "6"
